<!--
    PROJECT CARD TEMPLATE
    Reference only — renderer.js builds cards dynamically from projects.json.
    This shows the structure the renderer produces so you can restyle if needed.

    Placeholders (replaced at runtime):
    {{size}}       → large | medium | wide | tall | small
    {{id}}         → project slug
    {{category}}   → e.g. "Game / Unity"
    {{year}}       → 2025
    {{title}}      → "Stickman Run"
    {{description}}→ short description
    {{tech}}       → tech chips loop
    {{status}}     → status/cta block
-->
<a href="project.html?id={{id}}" class="bento-card fade-in" data-size="{{size}}" data-project-id="{{id}}">
    <div class="card-top">
        <span class="card-category">{{category}}</span>
        <span class="card-year">{{year}}</span>
    </div>
    <div>
        <h3 class="card-title">{{title}}</h3>
        <p class="card-desc">{{description}}</p>
    </div>
    <div class="card-bottom">
        <div class="card-tech">
            <!-- Loop: <span>{{tech}}</span> -->
        </div>
        <!-- Status block: <span class="card-cta">Open →</span> OR <span class="card-status coming-soon">Coming soon</span> -->
    </div>
</a>
